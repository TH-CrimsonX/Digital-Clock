<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="crimsonx_32x32.ico">
    <link rel="stylesheet" href="font.css">
    <link rel="stylesheet" href="style.css">
    <title>Digital Clock by Crimson X</title>
</head>
<body>
    <main class="container">
        <time id="clock" aria-label="เวลาปัจจุบัน">
            <span id="hours">00</span><span class="clock-separator" aria-hidden="true">:</span><span id="minutes">00</span><span class="clock-separator" aria-hidden="true">:</span><span id="seconds">00</span>
        </time>
        <div id="countdownDisplay"></div>

        <button id="mainClearAlarmBtn" class="custom-btn link-btn" type="button" hidden><span>ปิดนาฬิกาปลุก</span></button>
        <button id="toggleAlarmSetupBtn" class="custom-btn link-btn" type="button"><span>ตั้งค่า</span></button>

        <section id="alarmControls" class="alarm-controls" aria-label="ตั้งค่านาฬิกาปลุก" hidden>
            <input id="alarmTime" name="alarmTime" type="datetime-local" aria-label="วันและเวลาปลุก">
            <div class="frame">
                <button id="setAlarmBtn" class="custom-btn link-btn" type="button"><span>ยืนยันตั้งปลุก</span></button>
                <button id="cancelAlarmSetupBtn" class="custom-btn link-btn" type="button"><span>กลับหน้าแรก</span></button>
                <a class="custom-btn link-btn" href="https://github.com/TH-CrimsonX" target="_blank" rel="noopener noreferrer"><span>GitHub</span></a>
                <button id="popupBtn" class="custom-btn link-btn" type="button"><span>เปิดแบบ Pop-up</span></button>
            </div>

            <label for="themeSelector">เลือกธีมสี:</label>
            <div class="theme-selection-wrapper">
                <button id="prevThemeBtn" class="arrow-btn" type="button" aria-label="ธีมก่อนหน้า">&lt;</button>
                <select id="themeSelector"></select>
                <button id="nextThemeBtn" class="arrow-btn" type="button" aria-label="ธีมถัดไป">&gt;</button>
            </div>

            <p class="powered-by-text">Powered by</p>
            <p class="powered-by-name">
                <a href="https://discord.com/users/122811441819549697" target="_blank" rel="noopener noreferrer" class="crimson-x-animated">Crimson X</a>
            </p>
        </section>
    </main>
<script src="script.js"></script>
</body>
</html>
